[platformio]
default_envs = x4pro, sticky
build_cache_dir = .cache

[base]
; pioarduino Arduino-ESP32 platform (Arduino core 3.3.x / ESP-IDF 5.5.x),
; matching the FreeInk SDK's verified toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: SSD1677's controller RAM holds the previous frame.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -fno-exceptions
  -Wno-bidi-chars

build_unflags =
  -std=gnu++11
  -fexceptions

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.mcu = esp32s3
board_build.partitions = partitions.csv

; FreeInk SDK libraries (vendored as a git submodule at firmware/freeink-sdk).
; ArduinoJson is used for the device <-> bridge JSON protocol.
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  bblanchon/ArduinoJson @ 7.4.2

; Device-specific settings live in include/config.h, keyed off the
; -DFREEINK_DEVICE_<NAME> flag of the env (X4 Pro vs Sticky): panel pins, panel
; mounting / UI_ROTATION, and which UART carries the console.

; --- Xteink X4 Pro: ESP32-S3, SSD1677 800x480 + GT911 touch + frontlight ------
[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8  ; 16 MB flash + 8 MB PSRAM (matches the X4 Pro)
build_flags =
  ${base.build_flags}
  ; X4 Pro has PSRAM; FREEINK_DEVICE_X4PRO enables the SDK device profile.
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_X4PRO=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

; --- Seeed reTerminal Sticky: ESP32-S3R8, SSD1677 800x480 + GT911 touch -------
; A magnetic 3.97" landscape e-ink note pad (106 x 65.5 mm), the same display
; controller and digitizer family as the X4 Pro but an entirely different
; pinout. Everything below comes from Seeed's hardware overview + the vendor
; peripheral demo, and matches the SDK's FREEINK_DEVICE_STICKY profile:
;   EPD   SCLK13 MOSI14 CS15 DC16 RST17 BUSY18 + panel EN47 (SSD1677)
;   GT911 touch on its own bus: SDA3 SCL2 INT21 RST41 EN42 @0x5D
;   buttons UP5 DOWN6, plus a shared AI/OK/PWR on GPIO4 (the deep-sleep wake pin)
;   BQ27220 fuel gauge 0x55 on the sensor bus SDA1 SCL0 (Wire1; touch owns Wire)
;   power latch PWR_HOLD45 + PWR_LOCK46 (asserted by BoardConfig::holdPowerRails)
;   microSD shares the EPD SPI bus (CS8 MISO12, card power EN10)
; Console: the USB-C port is a WCH CH343 UART bridge on GPIO43/44 (UART0), NOT
; native USB, so logs and flashing both go through UART0 (cfg::serial()).
; Flash: 32 MB QSPI part; the image is built DIO (the mode Seeed's own ESP-IDF
; demos and the community Sticky firmware use for it) with the repo's shared
; partitions.csv laid out in the first 16 MB of it.
[env:sticky]
extends = base
board = esp32-s3-devkitc-1        ; no PSRAM in this build: FreeInk keeps the
                                   ; 48 KB framebuffer in internal DRAM here
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 32MB
; The header flash size actually comes from the board manifest's upload section
; (the platform passes board.upload.flash_size to `esptool elf2image`), so it has
; to be overridden here -- otherwise the image claims the devkitc-1's 8 MB while
; Sticky has 32 MB and our partition table spans 16 MB of it.
board_upload.flash_size = 32MB
upload_speed = 460800             ; reliable over the on-board CH343 bridge
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
