[platformio]
default_envs = x4pro
build_cache_dir = .cache

[base]
; pioarduino Arduino-ESP32 platform (Arduino core 3.3.x / ESP-IDF 5.5.x),
; matching the FreeInk SDK's verified toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: SSD1677's controller RAM holds the previous frame.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -fno-exceptions
  -Wno-bidi-chars

build_unflags =
  -std=gnu++11
  -fexceptions

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.mcu = esp32s3
board_build.partitions = partitions.csv

; FreeInk SDK libraries (vendored as a git submodule at firmware/freeink-sdk).
; ArduinoJson is used for the device <-> bridge JSON protocol.
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  bblanchon/ArduinoJson @ 7.4.2

; --- Xteink X4 Pro: ESP32-S3, SSD1677 800x480 + GT911 touch + frontlight ------
[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8  ; 16 MB flash + 8 MB PSRAM (matches the X4 Pro)
build_flags =
  ${base.build_flags}
  ; X4 Pro has PSRAM; FREEINK_DEVICE_X4PRO enables the SDK device profile.
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_X4PRO=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2